name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must be >= go 1.26.2 declared in go.mod.
  GO_VERSION: "1.26.x"

jobs:
  build:
    if: github.repository == 'HLND2T/garm-provider-hyperv'
    # The full provider is Windows-only: provider/client_windows.go and
    # provider/lock_windows.go carry the real Hyper-V implementation, while the
    # !windows stubs return an error at startup. Building on any Linux runner
    # would produce a non-functional executable.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        shell: pwsh
        run: go test ./...

      - name: Build provider executable
        shell: pwsh
        run: |
          # -OutputPath is passed explicitly so build.ps1 never evaluates its
          # default (which relies on $PSScriptRoot and breaks on Windows
          # PowerShell 5.1 when -GarmRoot is not supplied).
          .\build.ps1 -Version "${{ github.ref_name }}" -OutputPath "bin\garm-provider-hyperv.exe"
          Get-Item "bin\garm-provider-hyperv.exe" | Select-Object FullName, Length

      - name: Package release bundle
        shell: pwsh
        run: |
          $bundle = "garm-provider-hyperv-windows-amd64"
          New-Item -ItemType Directory -Force -Path "release\$bundle" | Out-Null
          Copy-Item "bin\garm-provider-hyperv.exe" "release\$bundle\"
          Copy-Item "examples\garm-provider-hyperv.toml" "release\$bundle\"
          Copy-Item "examples\garm-provider.fragment.toml" "release\$bundle\"
          Copy-Item "scripts\preflight.ps1" "release\$bundle\"
          Compress-Archive -Path "release\$bundle\*" -DestinationPath "release\$bundle.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: garm-provider-hyperv-windows-amd64
          path: |
            bin/garm-provider-hyperv.exe
            release/garm-provider-hyperv-windows-amd64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: garm-provider-hyperv ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            bin/garm-provider-hyperv.exe
            release/garm-provider-hyperv-windows-amd64.zip
